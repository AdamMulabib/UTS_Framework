services:
  postgres:
    image: postgres:17
    container_name: gym-postgres
    restart: always
    environment:
      POSTGRES_USER: gym_admin
      POSTGRES_PASSWORD: gym_password123
      POSTGRES_DB: gym_management
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: